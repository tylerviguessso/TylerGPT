<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TÿlerGPT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6cf6'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --panel: #f4f4f4;
    --text: #0d0d0d;
    --muted: #6e6e6e;
    --line: #e3e3e3;
    --user: #f0f0f0;
    --code: #f6f6f6;
    --error: #d92d20;
    --send-bg: #0d0d0d;
    --send-fg: #ffffff;
    --focus: #3b6cf6;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --panel: #2f2f2f;
      --text: #ececec;
      --muted: #9a9a9a;
      --line: #3d3d3d;
      --user: #303030;
      --code: #171717;
      --error: #ff7a70;
      --send-bg: #ececec;
      --send-fg: #212121;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
  }
  .brand { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; padding: 6px 8px; }
  .icon-btn {
    display: grid; place-items: center;
    width: 38px; height: 38px;
    background: none; border: 0; border-radius: 10px;
    color: var(--muted);
  }
  .icon-btn:hover { background: var(--panel); color: var(--text); }

  #scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .hero {
    display: none;
    margin: 26vh 16px 0;
    text-align: center;
    font-size: 28px; font-weight: 600; letter-spacing: -0.02em;
  }
  body.empty .hero { display: block; }

  .thread { max-width: 760px; margin: 0 auto; padding: 12px 16px 28px; }
  .row { margin: 0 0 24px; }
  .row.user { display: flex; justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    padding: 10px 18px;
    border-radius: 22px;
    background: var(--user);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.5;
  }
  .content { line-height: 1.7; overflow-wrap: anywhere; }
  .row.error .content { color: var(--error); }
  .content > :first-child { margin-top: 0; }
  .content > :last-child { margin-bottom: 0; }
  .content p { margin: 0 0 0.9em; }
  .content h3 { font-size: 1.05em; margin: 1.2em 0 0.4em; }
  .content ul, .content ol { margin: 0 0 0.9em; padding-left: 1.5em; }
  .content li { margin: 0.2em 0; }
  .content code {
    background: var(--code);
    padding: 0.15em 0.4em;
    border-radius: 6px;
    font: 0.88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .content pre {
    background: var(--code);
    padding: 14px 16px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 0 0 0.9em;
    line-height: 1.5;
  }
  .content pre code { background: none; padding: 0; font-size: 0.88em; }

  .actions { margin-top: 6px; display: flex; gap: 2px; }
  .row.typing .actions { visibility: hidden; }
  .actions .icon-btn { width: 32px; height: 32px; border-radius: 8px; }

  .caret, .pulse {
    display: inline-block;
    width: 0.7em; height: 0.7em;
    border-radius: 50%;
    background: currentColor;
  }
  .caret { margin-left: 0.3em; vertical-align: -0.02em; }
  .pulse { animation: pulse 1.1s ease-in-out infinite; margin: 6px 0; }
  @keyframes pulse {
    0%, 100% { transform: scale(0.75); opacity: 0.55; }
    50% { transform: scale(1.05); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  footer {
    flex: none;
    padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 8px 8px 20px;
    background: var(--panel);
    border-radius: 28px;
  }
  textarea {
    flex: 1;
    min-height: 28px; max-height: 200px;
    padding: 7px 0;
    border: 0; outline: 0; resize: none;
    background: transparent; color: inherit;
    font: inherit; font-size: 16px; line-height: 1.5;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    flex: none;
    display: grid; place-items: center;
    width: 36px; height: 36px;
    border: 0; border-radius: 50%;
    background: var(--send-bg); color: var(--send-fg);
  }
  .send:disabled { opacity: 0.25; cursor: default; }
  .fine { margin: 10px 0 0; text-align: center; font-size: 12px; color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 8px);
    max-width: calc(100% - 32px);
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--text); color: var(--bg);
    font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body class="empty">

<header>
  <div class="brand">TÿlerGPT</div>
  <button id="newChat" class="icon-btn" aria-label="New chat" title="New chat">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
</header>

<div id="scroll">
  <h1 class="hero">What can I help with?</h1>
  <div id="thread" class="thread" aria-live="polite"></div>
</div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" maxlength="2000" placeholder="Ask anything" aria-label="Message TÿlerGPT"></textarea>
    <button id="send" class="send" aria-label="Send message" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
    </button>
  </div>
  <p class="fine">TÿlerGPT can make mistakes. Check important info.</p>
</footer>

<div id="toast" role="status"></div>

<script>
(() => {
  "use strict";

  /* ---------- Config ---------- */
  // Must be identical in admin.html. Keep it long and random.
  const ROOM = "tylergpt-y1b35sdwmyxcg9";
  const SERVER = "https://ntfy.sh";

  const IN_TOPIC = ROOM + "-in";                 // visitors -> you
  const outTopic = id => ROOM + "-out-" + id;    // you -> one visitor

  /* ---------- Helpers ---------- */
  const $ = s => document.querySelector(s);
  const scroller = $("#scroll"), thread = $("#thread");
  const input = $("#input"), sendBtn = $("#send"), toastEl = $("#toast");

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const byteLen = s => new TextEncoder().encode(s).length;
  const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => (b % 36).toString(36)).join("");

  let toastTimer;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3500);
  }

  // Small, safe markdown: **bold**, *italic*, `code`, ``` blocks, lists, headings.
  function md(src) {
    const blocks = [];
    let t = src.replace(/\u0000/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    t = t.replace(/```[^\n]*\n?([\s\S]*?)(```|$)/g, (_, code) => {
      blocks.push(code.replace(/\n$/, ""));
      return "\u0000" + (blocks.length - 1) + "\u0000";
    });
    const inline = s => s
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*\n]*)\*/g, "$1<em>$2</em>");
    const out = [];
    let list = null, para = [];
    const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } };
    const flushList = () => {
      if (list) { out.push(`<${list.tag}>` + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`); list = null; }
    };
    for (const line of t.split("\n")) {
      let m;
      if (/^\u0000\d+\u0000$/.test(line.trim())) { flushPara(); flushList(); out.push(line.trim()); }
      else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushPara(); if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; } list.items.push(m[1]); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; } list.items.push(m[1]); }
      else if ((m = line.match(/^#{1,3}\s+(.*)$/))) { flushPara(); flushList(); out.push("<h3>" + inline(m[1]) + "</h3>"); }
      else if (line.trim() === "") { flushPara(); flushList(); }
      else { flushList(); para.push(line); }
    }
    flushPara(); flushList();
    return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => "<pre><code>" + blocks[i] + "</code></pre>");
  }

  const COPY_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
  const CHECK_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';

  /* ---------- State ---------- */
  let sid = store.get("tgpt:sid", null);
  if (!sid) { sid = newId(); store.set("tgpt:sid", sid); }
  const key = k => `tgpt:${k}:${sid}`;

  let msgs = store.get(key("msgs"), []);          // [{role, text}]
  let seen = new Set(store.get(key("seen"), []));  // ntfy message ids already shown
  let lastTs = store.get(key("ts"), 0);            // unix time of newest reply seen
  let source = null, stick = true, thinkingEl = null;

  /* ---------- Rendering ---------- */
  const follow = () => { if (stick) scroller.scrollTop = scroller.scrollHeight; };
  scroller.addEventListener("scroll", () => {
    stick = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
  });

  function buildRow(role, text) {
    const row = document.createElement("div");
    row.className = "row " + role;
    if (role === "user") {
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = text;
      row.append(b);
      return row;
    }
    const c = document.createElement("div");
    c.className = "content";
    if (role === "error") c.textContent = text; else c.innerHTML = md(text);
    row.append(c);
    if (role === "bot") {
      row.dataset.text = text;
      const a = document.createElement("div");
      a.className = "actions";
      a.innerHTML = `<button class="icon-btn copy" aria-label="Copy" title="Copy">${COPY_ICON}</button>`;
      row.append(a);
    }
    return row;
  }

  function typeOut(row, text) {
    const el = row.querySelector(".content");
    const toks = text.match(/\s+|\S+/g) || [text];
    const duration = Math.min(9000, Math.max(800, text.length * 16));
    const per = Math.max(1, Math.round(toks.length / (duration / 50)));
    let i = 0;
    (function step() {
      i = Math.min(toks.length, i + per);
      let html = md(toks.slice(0, i).join(""));
      if (i < toks.length) {
        html = html.replace(/(<\/(?:p|li|h3)>)(?![\s\S]*<\/(?:p|li|h3)>)/, '<span class="caret"></span>$1');
      }
      el.innerHTML = html;
      follow();
      if (i < toks.length) setTimeout(step, 35 + Math.random() * 30);
      else row.classList.remove("typing");
    })();
  }

  function addMessage(role, text, animate = false) {
    const row = buildRow(role, text);
    thinkingEl ? thread.insertBefore(row, thinkingEl) : thread.append(row);
    document.body.classList.remove("empty");
    if (animate && role === "bot") {
      row.classList.add("typing");
      row.querySelector(".content").textContent = "";
      typeOut(row, text);
    }
    follow();
  }

  function showThinking() {
    if (thinkingEl) return;
    thinkingEl = document.createElement("div");
    thinkingEl.className = "row bot";
    thinkingEl.innerHTML = '<span class="pulse" role="img" aria-label="TÿlerGPT is thinking"></span>';
    thread.append(thinkingEl);
    follow();
  }
  function hideThinking() { if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; } }

  function remember(role, text) {
    msgs.push({ role, text });
    store.set(key("msgs"), msgs.slice(-200));
  }

  thread.addEventListener("click", e => {
    const btn = e.target.closest(".copy");
    if (!btn) return;
    const text = btn.closest(".row").dataset.text || "";
    navigator.clipboard?.writeText(text).then(() => {
      btn.innerHTML = CHECK_ICON;
      setTimeout(() => { btn.innerHTML = COPY_ICON; }, 1500);
    }).catch(() => toast("Couldn't copy to clipboard."));
  });

  /* ---------- Sending ---------- */
  async function send() {
    const text = input.value.trim();
    if (!text) return;
    if (byteLen(text) > 3800) { toast("That message is too long. Try splitting it up."); return; }

    input.value = "";
    autosize();
    sendBtn.disabled = true;
    stick = true;

    if (!lastTs) { lastTs = Math.floor(Date.now() / 1000) - 1; store.set(key("ts"), lastTs); }
    remember("user", text);
    addMessage("user", text);
    showThinking();

    try {
      const res = await fetch(`${SERVER}/${IN_TOPIC}?title=${encodeURIComponent(sid)}`, { method: "POST", body: text });
      if (!res.ok) throw new Error("HTTP " + res.status);
    } catch {
      hideThinking();
      addMessage("error", "Something went wrong. Please try again.");
    }
  }

  /* ---------- Receiving ---------- */
  function onReply(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    store.set(key("seen"), Array.from(seen).slice(-200));
    lastTs = Math.max(lastTs, m.time || 0);
    store.set(key("ts"), lastTs);

    const text = (m.message || "").trim();
    if (!text) return;

    const fresh = Date.now() / 1000 - m.time < 20;   // old replies (page reload) appear instantly
    hideThinking();
    remember("bot", text);
    addMessage("bot", text, fresh);
  }

  function connect() {
    if (source) source.close();
    const since = lastTs || Math.floor(Date.now() / 1000);
    source = new EventSource(`${SERVER}/${outTopic(sid)}/sse?since=${since}`);
    source.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.event === "message") onReply(m);
    };
  }

  /* ---------- Composer ---------- */
  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }
  input.addEventListener("input", () => { autosize(); sendBtn.disabled = !input.value.trim(); });
  input.addEventListener("keydown", e => {
    const touch = matchMedia("(pointer: coarse)").matches;
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !touch) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);

  $("#newChat").addEventListener("click", () => {
    sid = newId();
    store.set("tgpt:sid", sid);
    msgs = []; seen = new Set(); lastTs = 0;
    hideThinking();
    thread.replaceChildren();
    document.body.classList.add("empty");
    connect();
    input.focus();
  });

  /* ---------- Start ---------- */
  msgs.forEach(m => addMessage(m.role, m.text));
  stick = true; follow();
  connect();
})();
</script>
</body>
</html>
